name: Build macOS stack tracer

on:
  workflow_call:

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Mono capture bridge
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Build universal library
        run: bash native/build-macos.sh
      - name: Test packaged release library
        run: |
          clang native/tests/native-smoke.c -o /tmp/native-smoke
          /tmp/native-smoke "$PWD/Libraries/macOS/libmultiplayer_stacktrace.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-stacktrace
          path: Libraries/macOS/*.dylib
          if-no-files-found: error
